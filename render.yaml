services:
  - type: web
    name: plightful-beauty
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn plightful.wsgi:application
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: plightful-beauty-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: plightful-beauty.onrender.com

databases:
  - name: plightful-beauty-db
    plan: free